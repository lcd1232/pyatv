[aliases]
test=pytest

[tool:pytest]
testpaths = tests
norecursedirs = .git

[flake8]
exclude = .venv,.git,.tox,docs,venv,bin,lib,deps,build
# vendored GPLv2 derived work, kept as upstream wrote it
extend-exclude = pyatv/protocols/airplay/mirror/_saphash_systemcrash
max-line-length = 88
ignore = E203, W503

[pydocstyle]
match_dir = ^((?!\.|www_static|_saphash_systemcrash).)*$
