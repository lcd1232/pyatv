[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0"]

[project]
name="pyatv"
license = "MIT"
license-files = ["LICENSE.md"]
description = "A client library for Apple TV and AirPlay devices"
readme = "README.md"
authors = [{ name = "Pierre Ståhl", email = "pierre.staahl@gmail.com" }]
requires-python = ">=3.9.0"
keywords = ["apple", "tv", "airplay", "raop", "companion", "dmap", "dacp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dynamic = ["version", "dependencies"]

[project.urls]
"Homepage" = "https://pyatv.dev"
"Repository" = "https://github.com/postlund/pyatv"
"Bug Reports" = "https://github.com/postlund/pyatv/issues"

[project.scripts]
atvremote = "pyatv.scripts.atvremote:main"
atvproxy = "pyatv.scripts.atvproxy:main"
atvscript = "pyatv.scripts.atvscript:main"
atvlog = "pyatv.scripts.atvlog:main"

[tool.setuptools.dynamic]
version = { attr = "pyatv.const.__version__" }

[tool.setuptools.packages.find]
include = ["pyatv*"]
# _saphash_systemcrash is derived from GPLv2 code (openairplay/airplay2-receiver)
# and pyatv is MIT.  Nothing imports it at runtime -- fply.m2_stepper2_compress
# runs the recovered fairplay_sap.region_a.hash_block instead -- and its only
# caller is a source-tree test that checks the recovery against it.
exclude = ["pyatv.protocols.airplay.mirror._saphash_systemcrash*"]

[tool.black]
# _saphash_systemcrash is vendored GPLv2 kept as upstream wrote it.
extend-exclude = '(protobuf/(__init__|.*_pb2).py)|__pycache__|mirror/_saphash_systemcrash/'
include = '(pyatv|tests|examples|scripts).*\.py'

[tool.isort]
skip_glob = [
    "pyatv/protocols/mrp/protobuf/*.py",
    "pyatv/protocols/airplay/mirror/_saphash_systemcrash/*",
]
profile = "black"
force_sort_within_sections = true
known_first_party = [
    "pyatv",
    "tests",
    "scripts",
]
forced_separate = [
    "tests",
    "scripts",
]

[tool.mypy]
# _saphash.py is the vendored GPLv2 derived work, kept unmodified; its three
# errors are upstream's.  __init__.py beside it is pyatv's own and stays under
# the typing gate.
exclude = ['pyatv/protocols/airplay/mirror/_saphash_systemcrash/_saphash\.py$']

[[tool.mypy.overrides]]
module = [
    "miniaudio",
    "audio_metadata",
    "srptools",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
